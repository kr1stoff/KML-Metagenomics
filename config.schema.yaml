$schema: "https://json-schema.org/draft/2020-12/schema"
type: object
required:
  - samples_tsv
  - workflow
  - conda
  - threads
  - database
  - software
  - params
properties:
  samples_tsv:
    type: string
    description: "样本输入表路径 (TSV 三列: 样本ID, R1路径, R2路径, 无表头)"
  workflow:
    type: object
    required: [steps]
    properties:
      steps:
        type: array
        description: "启用的分析步骤"
        items:
          type: string
          enum:
            - fastp
            - fastqc
            - multiqc
            - host_removal
            - assembly
            - gene_prediction
            - gene_clustering
            - quantification
  conda:
    type: object
    required: [python, fastqc, multiqc, fastp, bowtie2, megahit]
    properties:
      python:
        type: string
        description: "Python conda 环境名"
      fastqc:
        type: string
        description: "fastqc conda 环境名"
      multiqc:
        type: string
        description: "multiqc conda 环境名"
      fastp:
        type: string
        description: "fastp conda 环境名"
      bowtie2:
        type: string
        description: "bowtie2 conda 环境名"
      megahit:
        type: string
        description: "megahit conda 环境名"
  threads:
    type: object
    required: [low, medium, high]
    properties:
      low:
        type: integer
        minimum: 1
        description: "低线程数"
      medium:
        type: integer
        minimum: 1
        description: "中线程数"
      high:
        type: integer
        minimum: 1
        description: "高线程数"
  database:
    type: object
    required: [host_reference]
    properties:
      host_reference:
        type: string
        description: "宿主参考基因组 fasta 路径 (bowtie2 index 前缀)"
  software:
    type: object
    required: [metagenemark_bin, metagenemark_model]
    properties:
      metagenemark_bin:
        type: string
        description: "MetaGeneMark gmhmmp 可执行文件路径"
      metagenemark_model:
        type: string
        description: "MetaGeneMark 模型文件路径"
  params:
    type: object
    required: [fastp, bowtie2, megahit, cd_hit]
    properties:
      fastp:
        type: string
        description: "fastp 质控过滤参数"
      bowtie2:
        type: object
        required: [host_removal, mapping]
        properties:
          host_removal:
            type: string
            description: "bowtie2 去宿主比对参数"
          mapping:
            type: string
            description: "bowtie2 基因定量比对参数"
      megahit:
        type: string
        description: "megahit 组装参数"
      cd_hit:
        type: string
        description: "cd-hit 聚类参数"
