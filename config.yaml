# KML-Metagenomics 宏基因组分析流程配置文件

# 样本输入表: 三列 (样本ID, R1路径, R2路径), TSV格式, 无表头
samples_tsv: "input.tsv"

# 流程步骤开关
workflow:
  steps:
    - fastp          # 质控过滤
    - fastqc         # 质控报告
    - multiqc        # 汇总报告
    - host_removal   # 去宿主
    - assembly       # 宏基因组组装
    - gene_prediction  # 基因预测
    - gene_clustering  # 基因去冗余
    - quantification   # 基因丰度定量

# Conda 环境
conda:
  python: python3.12
  fastqc: basic
  multiqc: basic
  fastp: basic2
  bowtie2: basic2
  megahit: meta
  seqtk: basic
  cd_hit: meta
  samtools: basic

# 线程分级
threads:
  low: 4
  medium: 8
  high: 16

# 参考数据库
database:
  host_reference: "/data/mengxf/Database/reference/hg19/hg19.fa"
  metagenemark_model: "/data/mengxf/Software/MetaGeneMark_linux_64/mgm/MetaGeneMark_v1.mod"

# 第三方软件路径
software:
  gmhmmp: "/data/mengxf/Software/MetaGeneMark_linux_64/mgm/gmhmmp"

params:
  fastp: "-g -q 5 -u 50 -n 15 -l 150 --overlap_diff_limit 1 --overlap_diff_percent_limit 10"
  bowtie2:
    host_removal: "--end-to-end --sensitive --no-hd --no-sq -I 200 -X 400"
    mapping: "--end-to-end --sensitive --no-hd --no-sq -I 200 -X 400"
  # megahit -m memory参数宏基因组推荐 64G 以上, 按照当前服务器的线程数, 内存数进行调整. 
  # 当前服务器为 32 线程, 256G 内存. -m 64000000000 -t 16 (64G内存 + 16线程)
  megahit: "--presets meta-large -m 64000000000"
  # cd-hit 内存 64G
  # Claude: -n 参数 word length 5 -> 8, 5 速度太慢了
  cd_hit: "-G 0 -aS 0.9 -g 1 -d 0 -c 0.95 -n 8 -M 64000"
  gmhmmp: "-a -d -f G -p 1"
